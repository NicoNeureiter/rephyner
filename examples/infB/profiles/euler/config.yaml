executor: slurm
jobs: 20
local-cores: 1
printshellcmds: true
keep-going: true
rerun-incomplete: true
latency-wait: 120
restart-times: 1
max-jobs-per-second: 2
max-status-checks-per-second: 10

default-resources:
  - mem_mb_per_cpu=1000
  - runtime=60

set-resources:
  render_xml:
    mem_mb_per_cpu: 1000
    runtime: 5
  run_beast:
    mem_mb_per_cpu: 8000
    runtime: "7d"
    cpus_per_task: 2
  loganalyser:
    mem_mb_per_cpu: 2000
    runtime: 30
  summarize:
    mem_mb_per_cpu: 1000
    runtime: 20