# Benchmark configuration for rephyner vs CoalRe on InfB.

models:
  rephyner:
    block_dir: blocks/rephyner
    namespace: ":rephyner.network:rephyner.statistics:rephyner.simulator:rephyner.distribution:rephyner.operators:rephyner.operators.localtreeoperators:rephyner.operators.networkedgeoperators"
    seed_base: 1000
  coalre:
    block_dir: blocks/coalre
    namespace: ":coalre.network:coalre.distribution:coalre.operators:coalre.simulator:coalre.statistics"
    seed_base: 2000

template:
  xml: templates/infB_template.xml

replicates: [0, 1]

mcmc:
  chain_length: 40000
  store_every: 10000
  log_every: 1000
  screen_log_every: 1000
  pop_size: 11.5

loganalyser:
  burnin_percent: 10

commands:
  beast: beast
  loganalyser: "applauncher LogAnalyser"
