# Does a higher reassortment rate make the target land inside the prior's reticulate mode,
# where alpha can tune it, instead of straddling the tree/reticulate transition?
results_dir: "results_hirho"
cells:
  n_taxa: [5, 10, 20]
  n_segments: [8]
  reassortment_rate: [1.0, 2.0, 5.0]
alpha_ladder: [0.2, 0.4, 0.8, 1.6, 3.2, 6.4, 12.8]
target_sims: 1000
prior_mcmc:
  chain_length: 2000000
  log_interval: 2000
  burnin_percent: 20
