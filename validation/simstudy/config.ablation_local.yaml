# Reduced local operator ablation, for directional results only. Merged on top of config.yaml:
#   snakemake --configfile config.yaml config.ablation_local.yaml --cores N ablation
# 3 variants x 2 alpha x 2 datasets x 1 seed = 12 runs at 10M steps, ~75 CPU-min each.
# Writes to its own directory, so it never touches the cluster results in results/.
results_dir: "results_ablation_local"
cells:
  reassortment_rate: [6.0]
datasets: 2
seeds: [1]
mcmc:
  chain_length: 10000000
  log_every: 5000
  store_every: 1000000
  burnin_percent: 10
ablation:
  reassortment_rate: [6.0]
  settings: [1.0, 4.0]
  models: [rephyner, rephyner_tuned, rephyner_targeted]
